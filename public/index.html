<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>1 VS 1 FIGHT</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lobby.css"></head><body><main class="game-page">
<header class="title-row"><div><span class="live-dot"></span> ONLINE ARENA</div><h1>1 VS 1 FIGHT</h1><div id="connection-status">서버 연결 중...</div></header>
<section id="lobby" class="lobby"><p class="lobby-label">PRIVATE MATCH</p><h2>친구와 대전하기</h2><p>방을 만들고 생성된 코드를 친구에게 보내거나, 받은 코드를 입력하세요.</p><div class="lobby-actions"><button id="create-room">방 만들기</button><span>또는</span><form id="join-form"><input id="room-code-input" maxlength="6" autocomplete="off" placeholder="방 코드 6자리" aria-label="방 코드"><button>참가</button></form></div><p id="lobby-error" class="lobby-error" aria-live="polite"></p></section>
<section class="arena-frame hidden" id="arena-frame"><div class="room-bar"><span>ROOM</span><strong id="room-code">------</strong><button id="copy-code">코드 복사</button></div><div class="hud"><div class="player-hud p1"><div class="hud-label"><strong>PLAYER 1</strong><span id="p1-hp-text">100 HP</span></div><div class="hp-track"><div id="p1-hp" class="hp-fill"></div></div></div><div class="versus">VS</div><div class="player-hud p2"><div class="hud-label"><span id="p2-hp-text">100 HP</span><strong>PLAYER 2</strong></div><div class="hp-track"><div id="p2-hp" class="hp-fill"></div></div></div></div>
<div class="canvas-wrap" id="canvas-wrap"><canvas id="game-canvas" width="1000" height="560"></canvas><div id="message-layer" class="message-layer"><p id="status-kicker">MATCHMAKING</p><h2 id="main-message">상대방을 기다리는 중...</h2><p id="sub-message"></p><button id="restart-button" hidden>다시 시작</button></div><div id="impact-flash" class="impact-flash"></div></div></section>
<section class="controls hidden" id="controls"><div><kbd>A</kbd><kbd>←</kbd><strong>왼쪽</strong></div><div><kbd>D</kbd><kbd>→</kbd><strong>오른쪽</strong></div><div><kbd>W</kbd><kbd>↑</kbd><strong>점프</strong></div><div><kbd>SPACE</kbd><strong>펀치</strong></div></section><p class="player-note" id="player-note"></p></main><script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
